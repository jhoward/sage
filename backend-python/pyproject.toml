[project]
name = "sage"
version = "0.1.0"
description = "An AI-native notes and todo app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pywebview>=5.3",
    "tomli-w>=1.0",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sage = "sage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
